name: photobooth_flutter
description: "AI Photobooth application built with Flutter"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  bitsdojo_window: ^0.1.6
  camera: ^0.11.0+1
  camera_macos: ^0.0.9
  camera_platform_interface: ^2.7.0
  camera_windows: ^0.2.6+2
  carousel_slider: ^5.1.1
  crypto: ^3.0.6
  dotted_border: ^3.0.1
  file_picker: ^9.2.1
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  http: ^1.4.0
  image: ^4.5.4
  media_kit: ^1.1.10
  media_kit_libs_video: ^1.0.4
  media_kit_video: ^1.2.4
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  supabase_flutter: ^2.9.1
  virtual_keyboard_multi_language: ^1.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/characters/
    - assets/videos/
    - lib/workflows/ghiblionline.json
    - lib/workflows/packagingonline.json
    - lib/workflows/pixaronline.json
    - lib/workflows/swaplabonline.json

  fonts:
    - family: PolySans
      fonts:
        - asset: assets/fonts/PolySans-Regular.ttf
        - asset: assets/fonts/PolySans-Medium.ttf
        - asset: assets/fonts/PolySans-Bold.ttf
        - asset: assets/fonts/PolySans-Light.ttf
